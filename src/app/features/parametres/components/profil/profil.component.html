<div class="card" *ngIf="utilisateur">
  <h2 class="card__title">Profil administrateur</h2>
  <p class="card__description">
    Informations affichees dans l'application et sur les documents generes.
  </p>

  <div class="card__avatar-row">
    <div class="avatar">{{ utilisateur.initiales }}</div>
    <button class="btn btn--outline">Changer la photo</button>
  </div>

  <div class="grid">
    <div class="field">
      <label>Nom complet</label>
      <input type="text" [value]="utilisateur.nom" />
    </div>
    <div class="field">
      <label>Fonction</label>
      <input type="text" [value]="utilisateur.role" />
    </div>
    <div class="field">
      <label>Adresse e-mail</label>
      <input type="text" [value]="utilisateur.email" />
    </div>
    <div class="field">
      <label>Telephone</label>
      <input type="text" [value]="utilisateur.telephone" />
    </div>
  </div>
</div>
