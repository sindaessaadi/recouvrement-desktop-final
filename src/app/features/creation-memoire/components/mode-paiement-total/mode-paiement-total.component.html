<div class="mode">
  <p class="mode__intro">Paiement integral en une seule echeance.</p>

  <div class="grid">
    <div class="field">
      <label>Montant ({{ devise }}) <span class="field__hint">- repris de l'etape precedente</span></label>
      <input type="text" [value]="format.fmt(total)" readonly class="field__readonly" />
    </div>
    <div class="field">
      <label>Date d'echeance</label>
      <input type="date" [ngModel]="date" (ngModelChange)="onDateChange($event)" [min]="todayISO" />
      <p class="field__hint">Pre-remplie a la date du jour - aucune date anterieure autorisee.</p>
    </div>
  </div>

  <div class="table-card">
    <table class="table">
      <thead>
        <tr>
          <th>DESCRIPTION</th>
          <th class="table__right">MONTANT ({{ devise }})</th>
          <th>DATE</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Paiement comptant</td>
          <td class="table__right table__strong">{{ format.fmt(total) }}</td>
          <td>{{ date }}</td>
        </tr>
      </tbody>
    </table>

    <div class="comment">
      <label>Commentaire</label>
      <textarea
        [ngModel]="commentaire"
        (ngModelChange)="onCommentaireChange($event)"
        rows="3"
        placeholder="Ajouter une note ou une precision sur ce reglement (facultatif)"
      ></textarea>
    </div>
  </div>
</div>
